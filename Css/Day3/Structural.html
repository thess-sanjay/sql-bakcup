<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div p:nth-child(5){
            background-color: beige;
        }
        div p:nth-child(odd){
            background-color:coral;
        }
        div p:nth-child(even){
            background-color: blue;
        }
    </style>
</head>
<body>
    <div>
        <p>count-1</p>
        <p>count-2</p>
        <p>count-3</p>
        <p>count-4</p>
        <p>count-5</p>
        <p>count-6</p>
        <p>count-7</p>
        <p>count-8</p>
        <p>count-9</p>
        <p>count-10</p>
    </div>
</body>
</html>
