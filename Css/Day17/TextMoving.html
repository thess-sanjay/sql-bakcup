<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            background-color: black;
            color: white;
            font-family:Georgia, 'Times New Roman', Times, serif;
            white-space: nowrap;
            animation: textMove 50s ease infinite;

        }
        div{
            width: 100%;
            height: 80px;
            background-color: black;
            overflow: hidden;
        }

        @keyframes textMove{
            from{
                transform: translateX(100vw);
            }
            to{
                transform: translateX(-150vw);
            }
        }
    </style>
</head>
<body>
    <div>
    <h1>🚀Sale is Live! Grab the Opportunity🚀 🚀Sale is Live! Grab the Opportunity🚀 🚀Sale is Live! Grab the Opportunity🚀</h1>
    </div>
</body>
</html>
