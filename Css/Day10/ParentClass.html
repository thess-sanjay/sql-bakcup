<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            
        }
        h1{
            text-align: center;
            margin-bottom: 20px;
        }
        .parent{
            width: 80%;
            height: 500px;
            border: 1px solid;
            margin: 30px auto;
            position: relative;
        }
        .child{
            width: 120px;
            height: 100px;
            background-color: teal;
            color: white;
            text-align: center;
            line-height: 100px;
            position: absolute;
        }
        #child2{
            right: 0;
        }
        #child3{
            bottom: 0;
        }
        #child4{
            bottom: 0;
            right: 0;
        }
        #child5{
            left: 45%;
            top: 40%;
        }
    </style>
</head>
<body>
    <h1>Parent relative and child absolute</h1>
    <div class="parent">
        <div class="child" id="child1">child1</div>
        <div class="child" id="child2">child2</div>
        <div class="child" id="child3">child3</div>
        <div class="child" id="child4">child4</div>
        <div class="child" id="child5">child5</div>
    </div>
</body>
</html>
