<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        } 
        .parent{
            background-color: white;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            width: 800px;
            height: 300px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        } 
        .child{
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
        } 
    </style>
</head>
<body>
    <h1>Flex box in CSS</h1>
    <div class="parent">
        <div class="child" id="child1">Child1</div>
        <div class="child" id="child2">Child2</div>
        <div class="child" id="child3">Child3</div>
        <div class="child" id="child4">Child4</div>
        <div class="child" id="child5">Child5</div>
    </div>
</body>
</html>
