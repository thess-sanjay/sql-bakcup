<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            height: 100vh ;
        }
        .parent{
            width: 70%;
            height: 400px;
            background-color: black;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border-radius: 8px;
        }
        .box{
            width: 300px;
            height: 250px;
            color: white;
            background-color: red;
            font-size: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            transition: all 1s linear;
        }
        #box1:hover{
            transform: rotate(180deg);
            border-radius: 50%;
        }
        #box2:hover{
            transform:rotateX(60deg) ;
        }
        #box3:hover{
            transform: rotateY(80deg);
        }
    </style>
</head>
<body>
    <h1>transform: rotate() Property Demo</h1>
    <div class="parent">
    <div class="box" id="box1">rotate 2()</div>
    <div class="box" id="box2">rotate x()</div>
    <div class="box" id="box3">rotate y()</div>
</div>
</body>
</html>
