<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>1. Ordered List</h1>
    <h2>type = number(default)</h2>
    <ol type = 1>
        <li>Html</li>
        <li>Css</li>
        <li>JavaScript</li>
        <li>React.Js</li>
    </ol>
    <h2>type = A</h2>
        <ol type = "A">
        <li>Html</li>
        <li>Css</li>
        <li>JavaScript</li>
        <li>React.Js</li>
    </ol>
        <ol type = 1 start="10">
        <li>Html</li>
        <li>Css</li>
        <li>JavaScript</li>
        <li>React.Js</li>
    </ol>
</body>
</html>
