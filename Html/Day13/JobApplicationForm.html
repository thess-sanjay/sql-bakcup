<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>
                <h2>Job Application Form</h2>
            </legend>
            <table>
                <tr>
                    <td><label for="">FirstName:</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">LastName:</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">Email:</label></td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td><label for="">Phone Number:</label></td>
                    <td><input type="tel"></td>
                </tr>
                <tr>
                    <td><label for="">Date of Birth</label></td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td><label for="">Gender:</label></td>
                    <td><input type="radio" name="" id="">Male
                        <input type="radio" name="" id="">Female
                    </td>
                </tr>
                <tr>
                    <td><label for="">Address:</label></td>
                    <td><textarea name="" id="" ></textarea></td>
                </tr>
                <tr>
                    <td><label for="">City:</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">State:</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">PinCode:</label></td>
                    <td><input type="number"></td>
                </tr>
                <tr>
                    <td><label for="">Position Applied for:</label></td>
                    <td>
                        <input type="text" list="jobs" placeholder="Select your Role">
                        <datalist id="jobs">
                            <option value="FrontEnd Developer">FrontEnd Developer</option>
                            <option value="BackEnd Developer">BackEnd Developer</option>
                            <option value="FullStack Developer">FullStack Developer</option>
                            <option value="Test Engineer">Test Engineer</option>
                            <option value="Business Analyst">Business Analyst</option>
                            <option value="Data Analyst">Data Analyst</option>
                        </datalist>
                    </td>
                </tr>
                <tr>
                    <td><label for="">Upload Resume:</label></td>
                    <td><input type="file" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">LinkedIn Profile:</label></td>
                    <td><input type="url" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Available Start Date:</label></td>
                    <td><input type="date" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Expected Salary:</label></td>
                    <td><input type="number" name="" id=""></td>
                </tr>
                <tr>
                    <td><label for="">Willing to Relocate:</label></td>
                    <td><input type="checkbox" name="Yes" id="">Yes
                        <input type="checkbox" name="No" id="">No
                    </td>
                </tr>
                <tr>
                <td>
                <button>Submit</button>
                </td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
